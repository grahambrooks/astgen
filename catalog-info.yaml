    - tree-sitter
  links:
    - url: https://github.com/grahambrooks/astgen
      title: Source Repository
      icon: github
    - url: https://github.com/grahambrooks/astgen/releases
      title: Releases
    - url: https://github.com/grahambrooks/astgen/issues
      title: Issue Tracker
    - url: https://github.com/grahambrooks/astgen/blob/main/README.md
      title: README
spec:
  type: tool
  lifecycle: production
  owner: user:default/grahambrooks

